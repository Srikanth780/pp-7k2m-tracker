<script>
const CATS={"Food & Dining":["swiggy","zomato","dominos","mcdonald","kfc","starbucks","cafe","restaurant","hotel","biryani","bakery","chai"],
"Groceries":["bigbasket","blinkit","zepto","dmart","kirana","supermarket","instamart","ratnadeep"],
"Transport":["uber","ola","rapido","irctc","redbus","petrol","fuel","metro","fastag","indianoil","hpcl","bpcl"],
"Bills & Utilities":["jio","airtel","vodafone","bsnl","electricity","tsspdcl","apspdcl","bescom","gas","water","broadband","fibernet","recharge"],
"Rent / EMI":["rent","emi","loan","housing"],
"Shopping":["amazon","flipkart","myntra","ajio","meesho","nykaa","tatacliq","croma"],
"Entertainment":["bookmyshow","pvr","inox","steam"],
"Health":["pharmacy","apollo","medplus","hospital","clinic","1mg","pharmeasy","diagnostic"],
"Education":["udemy","coursera","school","college","tuition","byjus","fees"],
"Subscriptions":["netflix","spotify","hotstar","primevideo","youtube","icloud","applemedia","googleplay","sonyliv","zee5"],
"Transfers":[],"Investments":["ppf","nationalpension","npstrust","fixeddeposit","recurringdeposit"],"Stocks / MF":["zerodha","groww","upstox","angelone","angelbroking","5paisa","indmoney","paytmmoney","smallcase","kuvera","mutualfund","mfutility","bsestar","iccl","indianclearing","nsccl","nseclearing","sip","camsonline","kfintech","hdfcsec","icicidirect","sharekhan","motilalos","motilaloswal"],"Gold / Silver":["sovereigngold","sgb","digitalgold","safegold","augmont","mmtc","goldbees","goldetf","silveretf","goldbond","tanishq","malabargold","kalyanjewel","joyalukkas","caratlane","senco","pngadgil","tbztheoriginal","bullion","jewel"],"Other":[]};
const COL=["#0f5c4d","#c9a24a","#3b8ea5","#c0463a","#7a5ea8","#4f9d69","#d1792f","#9a6b4f","#5e7f8c","#b8508a","#7c8f3b","#3a6ea5","#8a8a8a"];
const KEY="eg_v1";let S={tx:[],rules:{},budgets:{},seen:{},accts:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let HIDE=true;
const _f=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
const inr=v=>HIDE?'₹ ••••':_f.format(v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const sum=a=>a.reduce((x,t)=>x+t.amt,0);
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return h.toString(36)};

/* ---------- parsing ---------- */
function parse(text){
  const l=text.toLowerCase(),OTP=/\b(?:otp|one[- ]time password|verification code)\b/i;
  /* fix 2: ignore real OTP messages, but not transactions that only carry a "never share your OTP" footer */
  if(OTP.test(text)){
    const rest=text.split(/[.!?]\s+(?=[A-Z])/).filter(x=>!/\b(?:share|never|do not|don'?t|beware|fraud|not you|call|disclose)\b/i.test(x)).join(". ");
    if(OTP.test(rest))return null;
  }
  /* fix 5: promos without any account evidence */
  const evid=/a\/c|\bacct?\b|account\s*(?:no\.?|number)?\s*[xX*\d]|\bx+\d{3,}|\*+\d{3,}|ending\s+\d{3,}|\bvpa\b|ref(?:erence)?\s*(?:no|number|#|:)|txn\s*(?:id|no)|\butr\b|\bimps\b|\bneft\b|\brtgs\b/i;
  if(/\b(?:win|won|winner|congratulations|cashback|reward points?|offer|coupon|voucher|discount|t&c|terms apply|apply now|click|pre-?approved|limited time|lucky)\b|https?:\/\/|bit\.ly/i.test(text)&&!evid.test(text))return null;
  /* fix 6: mandate / autopay / subscription set-up, reminders and future debits are not payments */
  if(/\b(?:mandate|auto-?pay|auto[- ]?debit|standing instruction|subscription)\b/i.test(text)){
    if(/will be debited|to be debited|scheduled|upcoming|due on|due date|reminder/i.test(text))return null;
    if(/\b(?:created|registered|set ?up|setup|approve|approval|request(?:ed)?|revoked|cancel+ed|paused|modified|pending)\b/i.test(text)&&!/\b(?:has been|was|been|is)\s+(?:successfully\s+)?debited|debited\s+(?:from|for|with|by)/i.test(text))return null;
  }
  /* fix 3: direction = whichever strong verb comes first; weak words only when no strong verb exists */
  const idx=re=>{const m=re.exec(l);return m?m.index:-1};
  const di=idx(/\b(?:debited|withdrawn|spent)\b|\bsent\s+(?:rs|inr|₹)/),ci=idx(/\b(?:credited|received|deposited|refund(?:ed)?)\b/);
  let debit;
  if(di>-1&&ci>-1)debit=di<ci;else if(di>-1)debit=true;else if(ci>-1)debit=false;
  else if(/\b(?:paid|purchase|autopay|auto-?debit|subscription|renewed)\b/.test(l))debit=true;else return null;
  /* fix 4: credit-card bill payments (either side) are not income or expense */
  let kind="";
  if(!debit&&/\b(?:payment|amount)\b.{0,60}?\b(?:received|credited|posted)\b.{0,60}?\bcard\b|thank you for (?:your )?payment.{0,60}?\bcard\b|\bcard\b.{0,40}?\b(?:payment|bill)\b.{0,40}?\b(?:received|credited|posted)\b/i.test(text))kind="card";
  if(debit&&/\b(?:credit\s*card|cc)\s*(?:bill|payment|dues?|outstanding)\b|\bcard\s*(?:bill|dues?|outstanding)\b|\b(?:towards|for|to)\s+[A-Za-z ]{0,25}credit\s*card\b/i.test(text))kind="card";
  /* fix 1: first amount that is not a balance / limit / due figure */
  const re=/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/gi;let m,amt=0;
  while((m=re.exec(text))){
    const ctx=text.slice(Math.max(0,m.index-32),m.index);
    if(/(?:avl|avail\w*|bal\w*|limit|outstanding|total due|min\w*\s+due)\b[^.]{0,24}$/i.test(ctx))continue;
    const v=parseFloat(m[1].replace(/,/g,""));if(v>0){amt=v;break}
  }
  if(!amt)return null;
  return{amt,debit,kind,merchant:merchant(text,debit)};
}
function merchant(t,debit){
  const cl=s=>{s=s.replace(/\./g," ").trim();return s?s.replace(/\b\w/g,c=>c.toUpperCase()):"Unknown"};
  let m=t.match(/vpa\s+([\w.\-]+)@/i);if(m)return cl(m[1]);
  const end=`(?=["']|\\s+on\\b|\\s+ref\\b|\\s+via\\b|\\s+upi\\b|\\s+avl\\b|\\s+using\\b|[.,;]|$)`;
  for(const v of (debit?["at","to","towards","from"]:["from","by","at"])){
    const r=new RegExp(`\\b${v}\\s+["']?([A-Za-z0-9&.'\\- ]{3,30}?)${end}`,"gi");let x;
    while((x=r.exec(t))){if(!/^(a\/c|acct?|account|card|vpa)\b|\bxx/i.test(x[1]))return cl(x[1])}
  }
  return "Unknown";
}
function autoCat(m){
  const k=norm(m);if(!k||k==="unknown")return null;
  if(S.rules[k])return S.rules[k];
  for(const[c,w]of Object.entries(CATS))if(w.some(x=>k.includes(x)))return c;
  return null;
}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function pDate(s){
  if(!s)return NaN;s=String(s).trim();let m;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){const d=new Date(s).getTime();if(!isNaN(d))return d}
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2}))?/)){   /* day first (Indian format) */
    let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;if(b>12&&a<=12)[a,b]=[b,a];
    return new Date(y,b-1,a,+(m[4]||12),+(m[5]||0)).getTime();
  }
  if(m=s.match(/^(\d{1,2})[ \-\/]([A-Za-z]{3,9})[ ,\-\/]+(\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2}))?/)){
    const mo=MON[m[2].slice(0,3).toLowerCase()];
    if(mo!==undefined){let y=+m[3];if(y<100)y+=2000;return new Date(y,mo,+m[1],+(m[4]||12),+(m[5]||0)).getTime()}
  }
  return new Date(s).getTime();
}
/* A message is a duplicate only if the SAME text, within 10 min, already came from an EARLIER import
   (e.g. live file + backfill file). Identical messages inside one file are separate payments. */
function addMsg(text,dateStr,st,cut,cx){
  st=st||{};cx=cx||{b:"s"+Date.now()+Math.random(),used:new Set()};
  text=(text||"").trim();if(!text)return 0;
  let d=pDate(dateStr);if(isNaN(d))d=Date.now();
  if(cut&&d<cut){st.old=(st.old||0)+1;return 0}
  const dup=S.tx.find(t=>t.raw===text&&t.b!==cx.b&&!cx.used.has(t.id)&&Math.abs(t.date-d)<6e5);
  if(dup){cx.used.add(dup.id);st.dup=(st.dup||0)+1;return 0}
  const p=parse(text);if(!p){st.skip=(st.skip||0)+1;return 0}
  const sx=S.tx.find(t=>t.src==="st"&&!t.mt&&t.debit===p.debit&&Math.abs(t.amt-p.amt)<.01&&Math.abs(t.date-d)<=1.5*864e5);
  if(sx){sx.mt=1;st.dup=(st.dup||0)+1;return 0}
  S.tx.push({id:hash(d+text+S.tx.length+Math.random()),amt:p.amt,debit:p.debit,merchant:p.merchant,date:d,cat:p.debit&&p.kind!=="card"?autoCat(p.merchant):null,raw:text,ac:accts(text),b:cx.b,kind:p.kind||"",own:p.kind==="card"});
  st.added=(st.added||0)+1;return 1;
}
function csvRows(t){
  const r=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);r.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);r.push(row)}return r;
}
/* Accepts: (1) "<date>||<message>@@@" (Shortcut files), (2) CSV exports with date + text/message/body columns, (3) one message per line */
function importText(txt,months){
  const st={added:0,old:0,skip:0,dup:0},cx={b:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),used:new Set()};let cut=0;
  if(months){const x=new Date();x.setMonth(x.getMonth()-months);cut=x.getTime()}
  txt=txt.replace(/^\uFEFF/,"");
  if(txt.includes("@@@")){
    for(const ch of txt.split("@@@")){const c=ch.trim();if(!c)continue;const i=c.indexOf("||");

function insights(){
  const now=new Date(),out=[],add=(icon,t,d,l)=>out.push({icon,t,d,l});
  const cur=L().filter(t=>t.debit&&sameM(t.date,now)),prev=L().filter(t=>t.debit&&sameM(t.date,offM(-1,now)));
  const income=sum(L().filter(t=>!t.debit&&sameM(t.date,now))),total=sum(cur),cc=byCat(cur),pc=byCat(prev);
  for(const[c,lim]of Object.entries(S.budgets)){if(!(lim>0))continue;const s=cc[c]||0;
    if(s>=lim)add("🚨",`${c} budget exceeded`,`${inr(s)} spent vs ${inr(lim)} limit. Pause non-essential spending here.`,"a");
    else if(s>=lim*.8)add("⚠️",`${c} at ${Math.round(s/lim*100)}% of budget`,`Only ${inr(lim-s)} left this month.`,"w")}
  for(const[c,v]of Object.entries(cc))if(v>1000&&pc[c]>0&&v>pc[c]*1.3)add("📈",`${c} is up ${Math.round((v/pc[c]-1)*100)}%`,`${inr(v)} vs ${inr(pc[c])} last month. A good place to cut back.`,"w");
  const top=Object.entries(cc).sort((a,b)=>b[1]-a[1])[0];
  if(total>0&&top&&top[1]/total>.35&&top[0]!=="Rent / EMI")add("🥧",`${top[0]} is ${Math.round(top[1]/total*100)}% of your spending`,`Trimming it by 15% would save about ${inr(top[1]*.15)} a month.`,"i");
  const wants=["Food & Dining","Shopping","Entertainment"].reduce((s,c)=>s+(cc[c]||0),0);
  if(total>0&&wants/total>.4)add("✂️","Wants outweigh needs",`Food delivery, shopping and entertainment are ${Math.round(wants/total*100)}% of spend (${inr(wants)}).`,"w");
  const small=cur.filter(t=>t.amt<300);if(small.length>=10)add("💧","Small spends are leaking money",`${small.length} payments under ₹300 added up to ${inr(sum(small))} this month.`,"w");
  const g={};L().filter(t=>t.debit).forEach(t=>(g[norm(nm(t))]=g[norm(nm(t))]||[]).push(t));
  const subs=[];for(const a of Object.values(g)){if(a.length<2)continue;a.sort((x,y)=>x.date-y.date);
    const gaps=a.slice(1).map((t,i)=>(t.date-a[i].date)/864e5),am=a.map(t=>t.amt);
    if(gaps.every(x=>x>=25&&x<=35)&&Math.max(...am)<=Math.min(...am)*1.1)subs.push(a[a.length-1])}
  if(subs.length)add("🔁",`${subs.length} recurring payment(s) detected`,`${subs.map(t=>esc(t.merchant)+" ("+inr(t.amt)+")").join(", ")}: ${inr(sum(subs))} a month. Cancel anything you don't use.`,"i");
  for(const t of cur){if(t.amt<2000)continue;const k=t.cat||"Uncategorized",pa=prev.filter(x=>(x.cat||"Uncategorized")===k),typ=pa.length?sum(pa)/pa.length:0;
    if(!typ||t.amt>typ*3){add("❓",`Unusual: ${inr(t.amt)} at ${esc(t.merchant)}`,`Much larger than your typical ${k} payment. Was this planned?`,"a");break}}
  const s=[...cur].sort((a,b)=>a.date-b.date);
  for(let i=1;i<s.length;i++)if(s[i].amt===s[i-1].amt&&s[i].merchant===s[i-1].merchant&&s[i].date-s[i-1].date<6e5){add("📄","Possible duplicate charge",`${inr(s[i].amt)} at ${esc(s[i].merchant)} twice within 10 minutes.`,"a");break}
  if(income>0){const r=(income-total)/income*100;add("💰",r>=20?`Savings rate ${Math.round(r)}%. Great discipline!`:`Savings rate only ${Math.round(r)}%`,`Income ${inr(income)}, spent ${inr(total)}. Aim for 20% or more.`,r>=20?"i":"w")}
  const u=cur.filter(t=>!t.cat).length;if(u)add("🏷️",`${u} expense(s) need a category`,"Tag them in the Tag tab so insights stay accurate.","i");
  return out;
}

const LKEY="pp_lock",DEF_H=["e15742b724df634679fd5791239461dda29332cf6deeba64565aa09599f7538d", "h-5x7ugokky1ag"];   /* fingerprints of the default code, not the code itself */
let LK={on:true,h:null,s:null,n:4,f:0,u:0},PB="",HT=0;

async function hp(pin,salt){

const verifyPin=async pin=>LK.h?(await hp(pin,LK.s))===LK.h:DEF_H.includes(await hp(pin,"pp-default"));
function lockUI(msg){

function showLock(){PB="";document.getElementById("lock").classList.remove("off");lockUI("")}

const shake=()=>{const l=document.getElementById("lock");l.classList.remove("shake");void l.offsetWidth;l.classList.add("shake")};

async function pk(k){
  if(Date.now()<LK.u){lockUI("Too many attempts. Wait "+Math.ceil((LK.u-Date.now())/1000)+"s");return}
  if(k==="<"){PB=PB.slice(0,-1);lockUI("");return}
  if(PB.length>=LK.n)return;
  PB+=k;lockUI("");

  if(await verifyPin(pin)){LK.f=0;LK.u=0;saveLK();hideLock();lockUI("");return}
  LK.f++;if(LK.f>=5)LK.u=Date.now()+30000*Math.pow(2,Math.min(LK.f-5,6));

}

    const ttl=u?`<div class="ds wr">${esc(ds||"Unknown")}</div>`:`<b>${esc(t.merchant)}</b>${ds?`<div class="ds">${esc(ds)}</div>`:""}`;
    h+=`<div class="li"><span class="ic">${t.own?"↔️":t.debit?ICON[t.cat||"Uncategorized"]:"💰"}</span><div class="grow">${ttl}<div>${t.own?`<span class="k">${t.kind==="card"?"Card bill payment":"Own transfer"} · not counted</span>`:t.debit?catSel(t.id,t.cat):'<span class="k">Income</span>'}</div></div><div class="ra"><b class="${t.own?"mu":t.debit?"":"gr"}">${t.debit?"−":"+"}${inr(t.amt)}</b><br><button class="x" title="Toggle own-account transfer" onclick="toggleOwn('${t.id}')">↔</button><button class="x" onclick="del('${t.id}')" aria-label="Delete">✕</button></div></div>`});
  document.getElementById("txl").innerHTML=h?`<div class="card">${h}</div>`:empty("🧾","Nothing here","Import messages in Settings to fill your ledger.");
}
function renderSet(){
  const el=document.getElementById("set");if(el.dataset.f&&tab==="set")return;
  el.innerHTML=`<div class="hd"><h1 class="serif">Settings</h1><p>Import, budgets and backup.</p></div>
  <div class="card"><h2 class="serif">Import statements &amp; messages</h2><p class="mu" style="margin-top:0">Bank or credit-card statements (PDF/CSV, several banks at once) and SMS files (messages.txt / backfill.txt). Duplicates are skipped.</p><label class="k"><input type="checkbox" id="six" checked> Only the last 6 months</label><br><br><input type="file" multiple accept=".pdf,.csv,.txt,application/pdf,text/csv,text/plain" onchange="doImport(this.files,document.getElementById('six').checked?6:0)"></div>
  <div class="card"><h2 class="serif">My bank accounts</h2><p class="mu" style="margin-top:0">Add the last 4 or 5 digits of your own accounts and cards. Money moving between them is not counted as spending or income.</p><div class="row"><input id="acin" inputmode="numeric" maxlength="5" placeholder="e.g. 1234" style="flex:1"><button class="btn" onclick="addAcct()">Add</button></div><div>${AC().map(a=>`<span class="chp" style="display:inline-block">••${a} <button class="x" onclick="rmAcct('${a}')" aria-label="Remove">✕</button></span>`).join("")}</div><p class="k">Detected from SMS text like "A/c XX1234". If a transfer slips through, tap ↔ on it in the Ledger.</p></div>
  <div class="card"><h2 class="serif">Monthly budgets (₹)</h2>${Object.keys(CATS).filter(c=>!["Transfers","Investments","Stocks / MF","Gold / Silver"].includes(c)).map(c=>`<div class="row" style="margin-bottom:8px"><span>${ICON[c]} ${c}</span><input type="${HIDE?"password":"number"}" inputmode="numeric" style="width:110px;text-align:right" value="${S.budgets[c]||""}" placeholder="0" onchange="S.budgets['${c}']=+this.value;save();render()"></div>`).join("")}</div>
  <div class="card"><h2 class="serif">Security</h2><div class="row" style="margin-bottom:12px"><span>Ask for mPIN when opening</span><input type="checkbox" ${LK.on?"checked":""} onchange="toggleLock(this)"></div><button onclick="changePin()">Change mPIN</button><p class="k">The mPIN locks the screen when the app opens and after it has been away for a minute. Until you change it, the default code is used. It stops casual snooping but does not encrypt the data stored in your browser.</p></div>
  <div class="card"><h2 class="serif">Backup</h2><div class="row"><button onclick="exportJ()">Export</button><button onclick="document.getElementById('rf').click()">Restore</button><button onclick="if(confirm('Delete all Paisa Patrol data on this device?')){S={tx:[],rules:{},budgets:{},seen:{},accts:[]};save();render()}">Clear all</button></div><input id="rf" type="file" accept=".json" class="hide" onchange="readFile(this.files[0],t=>{try{S=Object.assign({tx:[],rules:{},budgets:{},seen:{}},JSON.parse(t));save();render()}catch(e){alert('Invalid backup')}})"><p class="k">Your data lives only in this browser. Export a backup now and then, since clearing Safari data erases it.</p></div>`;
  el.dataset.f=1;
}
function renderNav(){
  const T=[["dash","Home"],["tag","Tag"],["ins","Patrol"],["txs","Ledger"],["set","Settings"]],P=pending().length;
  document.getElementById("nav").innerHTML=T.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${SV[k]}</svg>${l}${k==="tag"&&P?`<span class="bd">${P}</span>`:""}</button>`).join("");
}
function go(t){tab=t;["dash","tag","ins","txs","set"].forEach(k=>{const e=document.getElementById(k);e.classList.toggle("hide",k!==t);if(k===t){e.classList.remove("fade");void e.offsetWidth;e.classList.add("fade")}});renderNav();scrollTo(0,0)}
function rs(){document.getElementById("set").dataset.f="";render()}
function togglePriv(){HIDE=!HIDE;rs()}
function toggleOwn(id){const t=S.tx.find(x=>x.id===id);if(!t)return;const v=!t.own;[t,S.tx.find(x=>x.id===t.pr)].forEach(x=>{if(x){x.own=v;x.m=1}});save();render()}
function addAcct(){const v=document.getElementById("acin").value.trim();if(!/^\d{4,5}$/.test(v)){alert("Enter the last 4 or 5 digits of the account");return}if(!AC().includes(v))AC().push(v);reconcile();save();rs()}
function rmAcct(a){S.accts=AC().filter(x=>x!==a);reconcile();save();rs()}
function del(id){S.tx=S.tx.filter(t=>t.id!==id);save();render()}
function readFile(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsText(f)}
function exportJ(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="paisapatrol-backup.json";a.click()}
try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#14705d");g.addColorStop(1,"#0a3f35");x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle="#e3c06a";x.font="bold 112px Georgia,serif";x.textAlign="center";x.textBaseline="middle";x.fillText("₹",90,98);const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}
if(LK.on)showLock();else hideLock();
migrateCats();
render();go("dash");
</script></body></html>
